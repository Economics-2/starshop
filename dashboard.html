<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ড্যাশবোর্ড</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Your existing dashboard-specific CSS */
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #e0f2f7;
            display: flex; /* Changed to flex for header + content */
            flex-direction: column; /* Stack header and content vertically */
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .dashboard-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
            margin: 20px auto; /* Center the dashboard content below header */
            flex-grow: 1; /* Allow content to grow and push footer down */
        }
        h1 {
            color: #007bff;
        }
        button {
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #c82333;
        }
        /* Add styles for .main-header, .main-nav, .logo from your style.css if needed */
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container header-content">
            <h1 class="logo"><a href="index.html">My eBook Hub</a></h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="browse.html">Browse Books</a></li>
                    <li><a href="categories.html">Categories</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="#" id="logout-btn-nav">Logout</a></li> </ul>
            </nav>
        </div>
    </header>

    <div class="dashboard-content">
        <h1>আপনার ড্যাশবোর্ডে স্বাগতম!</h1>
        <p id="dashboard-welcome-message">...</p>
        <p>আপনি সফলভাবে লগইন করেছেন। এখানে আপনার ব্যক্তিগত বিষয়বস্তু এবং কার্যকারিতা থাকবে।</p>
        <button id="logoutBtn">লগআউট</button> </div>

    <footer class="main-footer">
        <div class="container footer-content">
            <p>&copy; 2025 Monjurul. All rights reserved.</p>
            <div class="social-links">
                <a href="https://github.com/Economics-2" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://github.com/Economics-2" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://github.com/Economics-2" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>

    <script>
        // Initialize Firebase - MUST BE HERE AGAIN FOR THIS SEPARATE PAGE
        const firebaseConfig = {
            apiKey: "AIzaSyCVyXmjKI9pL37LJXkVcWMPtZSaXZG802c", // Use your actual config
            authDomain: "loginpage-6cb4a.firebaseapp.com",
            projectId: "loginpage-6cb4a",
            storageBucket: "loginpage-6cb4a.firebasestorage.app",
            messagingSenderId: "475440251033",
            appId: "1:475440251033:web:1a9b2343c07fe4a996b808",
            measurementId: "G-ZLG460T4KR"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore(); // If you need firestore on dashboard

        // Function to handle logout
        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = 'index.html'; // Redirect back to index/login page
            }).catch((error) => {
                console.error("লগআউট ত্রুটি:", error);
            });
        }

        // Attach logout to both buttons
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        const logoutNavBtn = document.getElementById('logout-btn-nav');
        if (logoutNavBtn) {
            logoutNavBtn.addEventListener('click', function(e) {
                e.preventDefault(); // Prevent default link behavior
                handleLogout();
            });
        }


        // Check if user is logged in when dashboard page loads
        auth.onAuthStateChanged(user => {
            if (user) {
                // User is signed in. You can fetch and display user-specific data here.
                const welcomeMessage = document.getElementById('dashboard-welcome-message');
                if (welcomeMessage) {
                    db.collection('users').doc(user.uid).get().then(doc => {
                        if (doc.exists) {
                            const userData = doc.data();
                            welcomeMessage.textContent = `স্বাগতম, ${userData.username || user.email}!`;
                        } else {
                            welcomeMessage.textContent = `স্বাগতম, ${user.email}!`;
                        }
                    }).catch(error => {
                        console.error("Error fetching user data:", error);
                        welcomeMessage.textContent = `স্বাগতম, ${user.email}!`;
                    });
                }
            } else {
                // No user is signed in, redirect to index.html (login page)
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
